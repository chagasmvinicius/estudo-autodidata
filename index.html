<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>História Autodidata</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%93%96%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>História Autodidata</h1>
      <p>Trilha de vídeos do YouTube organizada por ciclos e aulas, alimentada direto da planilha.</p>
    </header>

    <div class="filters">
      <input type="search" id="busca" placeholder="Buscar por aula, vídeo ou canal..." />
      <select id="filtro-ciclo">
        <option value="">Todos os ciclos</option>
      </select>
      <label class="filters__checkbox">
        <input type="checkbox" id="ocultar-assistidos" />
        Ocultar assistidos
      </label>
    </div>

    <main>
      <p id="status" class="status">Carregando planilha...</p>
      <div id="content"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
